# Proxy inverso: TLS, limites de tasa y tamano de carga (RNF-01, RNF-03).
# En el VPS se agrega certbot y el bloque listen 443 ssl.

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_login:10m rate=5r/m;

upstream api_upstream {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Cabeceras de seguridad basicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Los videos de recorrido son grandes (RF-13).
    client_max_body_size 450m;
    proxy_read_timeout 300s;

    # Fuerza bruta contra el login: limite mucho mas estricto.
    location = /api/v1/auth/login {
        limit_req zone=api_login burst=3 nodelay;
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
